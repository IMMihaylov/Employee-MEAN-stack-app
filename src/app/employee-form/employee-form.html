<form class="employee-form" [formGroup]="employeeForm" (submit)="submitForm()">
    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="name" required />
        @if(name.invalid) {
        <mat-error>Name is required</mat-error>
        }
    </mat-form-field>

    <mat-form-field>
        <mat-label>Position</mat-label>
        <input matInput formControlName="position" placeholder="position" required />
        @if(position.invalid) {
        <mat-error>Position is required</mat-error>
        }
    </mat-form-field>
    <mat-radio-group formControlName="level" aria-label="Select employee level">
        <mat-radio-button value="junior">Junior</mat-radio-button>
        <mat-radio-button value="mid">Mid</mat-radio-button>
        <mat-radio-button value="senior">Senior</mat-radio-button>
    </mat-radio-group>
    <br />
    <button mat-raised-button color="primary" type="submit" [disabled]="employeeForm.invalid">
        {{ 'Add' }} Employee
    </button>
</form>
